name: "Ecommerce CI"
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setting up Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: "Installing dependencies"
        run: npm ci

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: "Docker build image"
        run: docker build -t ${{ secrets.DOCKER_USER }}/ecommerce-app:latest .

      - name: "Push image to Docker Hub"
        run: docker push ${{ secrets.DOCKER_USER }}/ecommerce-app:latest

      - name: "Smoke test"
        run: |
          docker run -d -p 3000:5555 --name ecommerce-app ${{ secrets.DOCKER_USER }}/ecommerce-app:latest
          sleep 10
          docker logs ecommerce-app
          docker ps
          curl --fail http://localhost:3000 || exit 1